[package]
name = "pretty-log"
version = "0.1.0"
edition = "2021"
description = "Parses JSON logs and prints them in a clean, colorized view for humans."
homepage = "https://github.com/blesswinsamuel/pretty-log"
repository = "https://github.com/blesswinsamuel/pretty-log"
license = "MIT"
readme = "README.md"
keywords = ["logs", "json", "cli", "logging", "pretty-print"]
categories = ["command-line-utilities", "development-tools::debugging"]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "blesswinsamuel/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Jobs to run before building artifacts
plan-jobs = ["./test"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Checksums to generate for each App
checksum = "sha256"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[dependencies]
serde_json = "1.0"
colored = "3"
clap = { version = "4.5.40", features = ["derive"] }
chrono = "0.4"
dateparser = "0.2.1"
signal-hook = { version = "0.3.18", features = ["extended-siginfo"] }

[dev-dependencies]
regex = "1.11"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
